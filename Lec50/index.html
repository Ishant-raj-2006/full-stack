<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Manipulation Advance</title>
    <style>
        body{
            background-color: black;
            color: aqua;
        }
    </style>
</head>
<body>
    <!-- <h1>Hello</h1> -->
    <div class="container">
        <h1>DOM Manipulation Advance</h1>
    </div>
    <script>
        // console.log("Hello Ishant")
        let h2 = document.createElement('h2');
        h2.innerText = "This is brand New h2";
        h2.setAttribute('class','test');
        h2.setAttribute('id','testing')
        console.log("Brand New Element = ",h2);

        let container = document.querySelector('.container');
        // container.append(h2);
        // container.prepend(h2);
        // container.before(h2);
        container.after(h2);
        container.remove(h2);
    </script>
</body>
</html>
