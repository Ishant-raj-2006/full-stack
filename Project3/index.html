<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch TV Shows Online, Watch Movies Online</title>
    <!-- Linking the StyleSheet  -->
    <link rel="stylesheet" href="style.css">
</head>

<header>
    <!-- Header Section -->
    <div class="header">
        <nav class="navbar">
            <div class="navbar-logo">
                <img src="Logo.png" alt="Netflix Logo" width="130">
            </div>
            <div class="navbar-action">
                <button class="btn btn-language">English</button><button class="btn btn-Signin"> Sign In</button>
            </div>
        </nav>
        <!-- OverLay for dark background -->
         <div class="overlay"></div>

         <!--  HERO Banner -->
           <div class="hero">
            <h1 class="hero-titles">Enjoy big movies, hit series & more from ₹199.</h1>
            <h2 class="hero-subtitle">Join today, Cancel anytime.</h2>
            <p class="heo-desc">
                Ready to Watch? Enter your email to create or restsrt your membership.
            </p>
            <div class="hero-form">
                <input type="email" placeholder="Email Address" class="email-input">
                <button class="btn btn-get-started">Get Started &gt;</button>
            </div>
           </div>
    </header>


    <!--Section Divider  -->
    <div class="divider"></div>

    <!-- Featue: Tv Watching -->
     <section class="featue">
        <div class="feature-text">
            <h1>Enjoy on TV</h1>
            <p>Watch on smart TVs, PlayStation, Xbox, Chromecast, Apple TV, Blu-ray players and more.</p>
        </div>
        <div class="feture-media">
            <img src="https://assets.nflxext.com/ffe/siteui/acquisition/ourStory/fuji/desktop/tv.png" alt="Tv">
            <video autoplay loop muted playsinline  > <source src="https://assets.nflxext.com/ffe/siteui/acquisition/ourStory/fuji/desktop/video-tv-in-0819.m4v" type="video/mp4"/></video>
        </div>
     </section>
     <!--Section Divider  -->
    <div class="divider"></div>
</body>

</html>
