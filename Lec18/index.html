    <div class="instagram">

        <!-- Left Bar -->
        <div class="left_bar">

            <div class="items">

                <div id="logo">Instagram</div>

            </div>

            <div class="items">

            <div class="items">

            </div>
            <div class="items">

            </div>
            <div class="items">
                <span class="material-symbols-outlined">
                    density_small

            </div>


        </div>
