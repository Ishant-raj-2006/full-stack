<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio, video, and iFrame </title>
</head>
<body>
    <h1>HTML - Audio , video , Iframe</h1>
    <!-- Without controls, audio cannot play and cannot display.  -->
    <audio controls src="./song.mp3"></audio>

    <!-- If we want to play audio when the page loads, then I will use `autoplay`.  -->
     <br><br>
     <audio autoplay controls src="./song.mp3"></audio>
     

     <!-- If we want to play audio in a loop, then I will use loop functions.  -->

     <audio loop controls src="./song.mp3"></audio>


     <!-- If we want to buy different audios, then I will be using notes from some  -->
      <audio muted loop controls src="./song.mp3"></audio>

      

      <!-- Video tags  -->


       <!-- If we want to add a thumbnail for any videos without starting when the page is reloaded or loaded Then I will use the `poster` tag.  -->
       <video width="400" height="300" autoplay loop  controls src="./Video.mp4" poster="./ima.jpg"></video>
       
</body>
</html>
