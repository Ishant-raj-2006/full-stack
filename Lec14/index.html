<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Padding, margin, box model </title>
    <style>
        body{
            background-color: black;
            color: wheat;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: rgb(236, 229, 214);
            margin: 10px;
            border:4px solid yellow;
            /* padding: 1px; */
        }
        .box_2{
            background-color: aqua;
            height: 100px;
            width: 100px;
            margin: 10px;
            border:4px solid yellow; 
        }
    </style>
</head>
<!-- Box model में सबसे पहले content आता है, फिर padding आता है। फिर border आता है, फिर margin आता है। इसी को box model बोलते हैं।  -->
<body>
    <h1>Padding, margin, box model </h1>
    <!-- Padding -->
    <div class="box"></div>
    <!-- Margin -->
     <!-- <br> -->
     <div class="box_2"></div>
</body>
</html>
