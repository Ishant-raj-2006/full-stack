<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digatl clock</title>
    <style>
        body{
            background-color: rgb(15, 13, 19);
            color: goldenrod;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;

        }
        /* scroll bar हटाने के लिए  */
        body::-webkit-scrollbar{
            display: none;
        }
        

        .clock-comtainer{
            text-align: center;
            font-size: 48px;
            border: 5px solid green;
            padding: 20px;
            border-radius: 10px;
            background-color: rgb(31, 61, 87);
        }
    </style>
</head>
<body>
    <!-- <h1>Java Script Digital Clock </h1> -->

    <div class="clock-comtainer">
        <h1 class="clock">00:00:00</h1>
    </div>
    <script>
        let element = document.querySelector('.clock')
        setInterval(() =>{
            let time = new Date();
            const options = {
                timeZone : 'Asia/Kolkata',
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
            element.textContent = (time.toLocaleTimeString('en-us',options))
            // console.log(time.toLocaleTimeString('en-us',options))
        },1000)
    </script>
</body>
</html>
